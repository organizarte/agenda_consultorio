<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu turno</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Agenda Psicológica">
<meta property="og:title" content="Tu próxima sesión">
<meta property="og:description" content="Tocá para ver tu turno y agregarlo al calendario de tu celular.">
<meta property="og:image" content="https://organizarte.github.io/agenda_consultorio/og-turno.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#557A5D;--pd:#2F5238;--pl:#E3EEE2;--bg:#FAF8F3;--at:#7E68B8;--ph:#476B4F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1F2A22;font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,Georgia,serif;font-size:19px}
.brand i{color:var(--at)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--p);color:#FAF8F3;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:19px;flex-shrink:0}
h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.15}
.sub{color:#5C6660;font-size:15px;margin-top:4px}
.card{background:#FDFCF8;border:1px solid #E2DED2;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;background:var(--pl);color:var(--pd);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row b{display:block;font-weight:600;font-size:16px}
.row span{color:#5C6660;font-size:14px;word-break:break-word}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;border:none;font-family:inherit;cursor:pointer}
.btn.pri{background:var(--p);color:#fff}
.btn.pri:hover{background:var(--ph)}
.btn.sec{background:#fff;color:#1F2A22;border:1px solid #D9D6CB}
.acciones{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:#5C6660;text-align:center;line-height:1.5}
.error{background:#FDFCF8;border:1px solid #E2DED2;border-radius:18px;padding:20px;text-align:center;color:#5C6660}
a.link{color:var(--pd)}
.resp{gap:12px}
.rt{font-size:17px;font-weight:600}
.dos{display:flex;flex-direction:column;gap:10px}
.btn.pel{background:#B4533F;color:#fff}
.okmsg{font-size:16px;font-weight:600;color:var(--pd);text-align:center}
.link.mini{background:none;border:none;color:var(--pd);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;align-self:center}
.err{color:#B4533F;font-size:14px;text-align:center}
</style>
</head>
<body>
<main id="app">
  <div class="error">Cargando tu turno…</div>
</main>
<script>
(function(){
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  function z(n){return ('0'+n).slice(-2);}
  var T;
  try{
    var h=location.hash.slice(1),v2=h.charAt(0)==='2';if(v2)h=h.slice(1);
    h=h.replace(/-/g,'+').replace(/_/g,'/');while(h.length%4)h+='=';
    var txt=decodeURIComponent(escape(atob(h)));
    if(v2){var c=txt.split('|');T={f:'20'+c[0].slice(0,2)+'-'+c[0].slice(2,4)+'-'+c[0].slice(4,6),h:(c[1]||'').slice(0,2)+':'+(c[1]||'').slice(2,4),m:c[2]||'',k:c[3]||'salvia',i:c[4]||'',d:+c[5]||0,l:c[6]||'',p:c[7]||'',c:c[8]||'',w:c[9]||''};}
    else T=JSON.parse(txt);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(T.f)||!/^\d{2}:\d{2}$/.test(T.h))throw 0;
  }catch(e){app.innerHTML='<div class="error">No se pudo leer el turno. Pedile a tu psicóloga que te mande el link de nuevo.</div>';return;}

  var PAL={"salvia": ["#557A5D", "#2F5238", "#E3EEE2", "#FAF8F3", "#7E68B8", "#476B4F"], "encuentro": ["#66775B", "#3E4C35", "#E6EADF", "#F8F5EE", "#9A8156", "#56664C"], "ovillo": ["#A95C42", "#6E3522", "#F5E2D8", "#FCF6F0", "#6E8466", "#924D36"], "divan": ["#6E5B4F", "#4A3B32", "#EFE6DF", "#F7F1EC", "#B07462", "#5C4B41"], "lavanda": ["#7A68B3", "#43367A", "#ECE8F7", "#FAF9F6", "#5E8566", "#67569C"], "oceano": ["#3E6F8C", "#1F4459", "#E0ECF3", "#F8F9F8", "#C0705A", "#335D76"], "rosa": ["#A35B70", "#6A3243", "#F4E3E8", "#FCF8F8", "#5E7C64", "#8C4B5E"], "grafito": ["#45505E", "#1F2730", "#E5E8EC", "#F9F8F6", "#A5803C", "#39424E"]};
  var col=PAL[T.k]||PAL.salvia;
  var r=document.documentElement.style;['--p','--pd','--pl','--bg','--at','--ph'].forEach(function(v,i){r.setProperty(v,col[i]);});
  var p=T.f.split('-'),hh=T.h.split(':');
  var ini=new Date(+p[0],+p[1]-1,+p[2],+hh[0],+hh[1]);
  var dur=Math.max(10,Math.min(240,+T.d||50));
  var fin=new Date(ini.getTime()+dur*60000);
  var fechaTxt=cap(DIAS[ini.getDay()])+' '+ini.getDate()+' de '+MESES[ini.getMonth()];
  var horaTxt=T.h+' a '+z(fin.getHours())+':'+z(fin.getMinutes());
  var virtual=T.m==='v';
  var lugar=String(T.l||'');
  var urlLugar=virtual&&lugar?(/^https?:\/\//.test(lugar)?lugar:'https://'+lugar):'';
  var prof=String(T.p||'');
  var marca=String(T.c||'Agenda Psicológica');
  var titulo='Sesión'+(prof?' con '+prof:'');
  var detalle=(virtual?'Sesión virtual.'+(urlLugar?' Enlace: '+urlLugar:''):'Sesión presencial.')+' Si no podés asistir, avisale a tu psicóloga.';
  var pasado=fin.getTime()<Date.now();

  // Horario de Argentina (UTC-3, sin cambio de hora) → UTC para el calendario
  function utc(d){var u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+3,d.getMinutes()));return u.getUTCFullYear()+z(u.getUTCMonth()+1)+z(u.getUTCDate())+'T'+z(u.getUTCHours())+z(u.getUTCMinutes())+'00Z';}
  var gcal='https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(titulo)+
    '&dates='+utc(ini)+'/'+utc(fin)+
    '&details='+encodeURIComponent(detalle)+
    (lugar?'&location='+encodeURIComponent(virtual?urlLugar:lugar):'')+
    '&ctz=America/Argentina/Buenos_Aires';
  function icsTxt(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda Psicologica//Turno//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+T.f.replace(/-/g,'')+T.h.replace(':','')+'-'+Math.random().toString(36).slice(2)+'@agenda',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),
    'DTSTART:'+utc(ini),'DTEND:'+utc(fin),
    'SUMMARY:'+icsTxt(titulo),'DESCRIPTION:'+icsTxt(detalle),
    (lugar?'LOCATION:'+icsTxt(virtual?urlLugar:lugar):''),(urlLugar?'URL:'+urlLugar:''),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsTxt(titulo),'TRIGGER:-PT1H','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  var icsUrl='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  var ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  var enApp=/FBAN|FBAV|Instagram|WhatsApp|Line\//.test(ua);

  var ico={
    cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    vid:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
    g:'<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M43.6 20.5H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/></svg>',
    apple:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9s-2-.9-3.4-.9c-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8 2.3-1.3 3.1-2.5c1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.4-.6 3.1-1.5z"/></svg>'
  };

  var puedeResp=!!(T.w&&/^\d{8,15}$/.test(T.w)&&!pasado);
  function waLink(txt){return 'https://api.whatsapp.com/send?phone='+T.w+'&text='+encodeURIComponent(txt);}
  var cuando=fechaTxt.charAt(0).toLowerCase()+fechaTxt.slice(1)+' a las '+T.h;
  document.title='Tu turno · '+fechaTxt;
  var marcaP=marca.split(' ');
  app.innerHTML=
    '<div class="brand"><div class="logo" aria-hidden="true">'+esc((T.i||marca.charAt(0)||'A').slice(0,2))+'</div><span>'+esc(marcaP[0])+(marcaP.length>1?' <i>'+esc(marcaP.slice(1).join(' '))+'</i>':'')+'</span></div>'+
    '<div><h1>'+(pasado?'Tu sesión':'Tu próxima sesión')+'</h1>'+(prof?'<div class="sub">con '+esc(prof)+'</div>':'')+'</div>'+
    '<div class="card">'+
      '<div class="row"><div class="ic">'+ico.cal+'</div><div><b>'+esc(fechaTxt)+'</b><span>'+esc(horaTxt)+' h</span></div></div>'+
      '<div class="row"><div class="ic">'+(virtual?ico.vid:ico.pin)+'</div><div><b>'+(virtual?'Virtual':'Presencial')+'</b><span>'+(virtual?(urlLugar?'<a class="link" href="'+esc(urlLugar)+'" target="_blank" rel="noopener">'+esc(lugar)+'</a>':'Tu psicóloga te va a mandar el enlace'):esc(lugar||'Consultá la dirección con tu psicóloga'))+'</span></div></div>'+
    '</div>'+
    (pasado?'<div class="note">Este turno ya pasó.</div>':
    '<div class="acciones">'+
      (ios?
        '<a class="btn pri" href="'+icsUrl+'" download="turno.ics">'+ico.apple+'Agregar al calendario del iPhone</a><a class="btn sec" href="'+gcal+'" target="_blank" rel="noopener">'+ico.cal+'Agregar a Google Calendar</a>':
        '<a class="btn pri" href="'+gcal+'" target="_blank" rel="noopener">'+ico.g+'Agregar a Google Calendar</a><a class="btn sec" href="'+icsUrl+'" download="turno.ics">'+ico.apple+'Agregar al calendario del iPhone</a>')+
      (virtual&&urlLugar?'<a class="btn sec" href="'+esc(urlLugar)+'" target="_blank" rel="noopener">'+ico.vid+'Abrir la videollamada</a>':'')+
    '</div>'+
    (puedeResp?'<div class="card resp" id="resp"></div>':'')+
    '<div class="note">Incluye un aviso 1 hora antes.'+(puedeResp?'':'<br>Si no podés asistir, avisale a tu psicóloga.')+'</div>'+
    (ios&&enApp?'<div class="note">Si al tocar no pasa nada, abrí este link en Safari: tocá ··· arriba y “Abrir en Safari”.</div>':''));
  if(puedeResp)document.getElementById('resp').innerHTML='<b class="rt">¿Vas a venir?</b><div class="note" style="text-align:left">Se abre WhatsApp con el mensaje listo para mandarle a tu psicóloga.</div><div class="dos">'+
    '<a class="btn pri" href="'+waLink('Hola! Confirmo mi asistencia a la sesión del '+cuando+'.')+'" target="_blank" rel="noopener">Confirmo mi asistencia</a>'+
    '<a class="btn sec" href="'+waLink('Hola! No voy a poder ir a la sesión del '+cuando+'.')+'" target="_blank" rel="noopener">No puedo ir</a></div>';
})();
</script>
</body>
</html>
